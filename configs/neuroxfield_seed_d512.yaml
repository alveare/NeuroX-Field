# EEG Predictive Super-Resolution — SEED dataset (62 channels)
seed_everything: 42
tags:
  exp: &exp seed_predictive_sr

trainer:
  default_root_dir: &workdir_path ./workdirs/seed_predictive_sr
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: bf16-mixed

  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: *workdir_path
      name: *exp
      version: 0

  num_sanity_val_steps: 0
  max_steps: 100000
  val_check_interval: 10000
  check_val_every_n_epoch: null
  log_every_n_steps: 50
  deterministic: null
  inference_mode: true
  use_distributed_sampler: false

  callbacks:
    - class_path: src.callbacks.model_checkpoint.CheckpointHook
      init_args:
        monitor: val/nmse_masked
        mode: min
        save_top_k: 1
        save_last: false
        filename: "best-{epoch}-{step}-val_nmse_masked={val/nmse_masked:.4f}"
        auto_insert_metric_name: false
    - class_path: src.callbacks.model_checkpoint.CheckpointHook
      init_args:
        every_n_train_steps: 10000
        save_top_k: -1
        save_last: true
    - class_path: src.callbacks.save_images.SaveImagesHook
      init_args:
        save_dir: val
        save_compressed: true
        num_channels_to_plot: 20
        max_save_samples: 5
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step

model:
  debug: false
  num_val_ensemble: 1
  clf_ckpt_path: downstream/eegnet_seed.pt
  clf_input_norm: scale
  clf_input_scale: 100.0  # must equal 1 / scale_const
  denoiser:
    class_path: src.models.neuroxfield.NeuroXField
    init_args:
      in_channels: 1
      patch_size_c: 1
      patch_size_t: 100
      num_groups: 4
      hidden_size: &hidden_dim 512
      decoder_hidden_size: 64
      num_encoder_blocks: 6
      num_cross_blocks: 2
      num_decoder_blocks: 2
      nf_max_freqs: 32
      s_scale: 16.0
  conditioner:
    class_path: src.models.conditioner.conditioner.EEGConditioner
    init_args:
      encoder: null
  diffusion_trainer:
    class_path: src.diffusion.flow_matching.training.FlowMatchingTrainer
    init_args:
      lognorm_t: true
      scheduler: &scheduler src.diffusion.flow_matching.scheduling.LinearScheduler
      prediction_type: x
      loss_space: x
      loss_type: l2
      masked_loss_weight: 1.0
      corr_loss_weight: 0.1
  diffusion_sampler:
    class_path: src.diffusion.flow_matching.sampling.EulerSampler
    init_args:
      num_steps: 50
      prediction_type: x
      guidance: 1.0
      guidance_interval_min: 0.0
      guidance_interval_max: 1.0
      scheduler: *scheduler
      w_scheduler: src.diffusion.flow_matching.scheduling.LinearScheduler
      guidance_fn: src.diffusion.base.guidance.simple_guidance_fn
      step_fn: src.diffusion.flow_matching.sampling.ode_step_fn
  ema_tracker:
    class_path: src.callbacks.simple_ema.SimpleEMA
    init_args:
      decay: 0.9999
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 1e-4
      weight_decay: 0.0

data:
  train_dataset:
    class_path: &class_path src.data.eeg_dataset.EEGDataset
    init_args:
      data_root: &data_root /data/SEED/seed_processed_lmdb
      dataset: &dataset_name seed
      eeg_channels: &num_channels 62
      eeg_timepoints: &num_timepoints 800
      downsample_factor: &ds_factor 1.0
      spatial_mask_mode: &mask_mode 2x
      spatial_mask_layout: &mask_layout 0
      spatial_mask_ratio: &mask_ratio [0.0, 0.5]
      normalization_mode: &normalization_mode 'scale'
      scale_const: &scale_const 0.01
      normalize_coords: &normalize_coords true
      visible_only: true
      split: 'train'
      seed: &seed 42

  eval_dataset:
    class_path: *class_path
    init_args:
      data_root: *data_root
      dataset: *dataset_name
      eeg_channels: *num_channels
      eeg_timepoints: *num_timepoints
      downsample_factor: *ds_factor
      spatial_mask_mode: *mask_mode
      spatial_mask_layout: *mask_layout
      spatial_mask_ratio: *mask_ratio
      normalization_mode: *normalization_mode
      scale_const: *scale_const
      normalize_coords: *normalize_coords
      visible_only: false
      split: 'val'
      seed: *seed

  pred_dataset: 
    class_path: *class_path
    init_args:
      data_root: *data_root
      dataset: *dataset_name
      eeg_channels: *num_channels
      eeg_timepoints: *num_timepoints
      downsample_factor: *ds_factor
      spatial_mask_mode: *mask_mode
      spatial_mask_layout: *mask_layout
      spatial_mask_ratio: *mask_ratio
      normalization_mode: *normalization_mode
      scale_const: *scale_const
      normalize_coords: *normalize_coords
      visible_only: false
      split: 'test'
      seed: *seed
  

  train_batch_size: 128
  train_num_workers: 16
  eval_batch_size: 16
  eval_num_workers: 2
  pred_batch_size: 64
  pred_num_workers: 0
